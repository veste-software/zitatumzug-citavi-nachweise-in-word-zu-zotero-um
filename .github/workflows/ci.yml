name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, test, build
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
            npm run build --if-present
          else
            echo "No package.json yet"
          fi
